

<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>3的倍数闪卡练习</title>

<style>

body {

  font-family: Arial, sans-serif;

  text-align: center;

  background: #f0f6ff;

  margin: 0;

  padding: 20px;

}

h1 { color: #2878d0; }

.card {

  background: white;

  max-width: 500px;

  margin: 25px auto;

  padding: 25px 15px;

  border-radius: 22px;

  box-shadow: 0 5px 20px #0001;

}

#number {

  font-size: 100px;

  font-weight: bold;

  margin: 25px 0;

  color: #14213d;

}

#timer {

  font-size: 20px;

  color: #2878d0;

}

button, select {

  font-size: 18px;

  padding: 12px 20px;

  border: none;

  border-radius: 12px;

  margin: 6px;

  cursor: pointer;

}

button:disabled { opacity: .45; }

.yes { background: #27ae60; color: white; }

.no { background: #e74c3c; color: white; }

.start { background: #2878d0; color: white; }

.other { background: #e2eaf5; }

#feedback {

  min-height: 28px;

  font-weight: bold;

  margin: 18px 0;

}

</style>

</head>

<body>

<h1>3的倍数判断 · 闪卡</h1>

<p>快速判断这个三位数是不是3的倍数</p>

<div class="card">

  <div id="progress">准备开始</div>

  <div id="number">---</div>

  <div id="timer">3 秒</div>

  <div id="feedback">点击开始练习</div>

  <button class="yes" id="yes" disabled>是</button>

  <button class="no" id="no" disabled>不是</button>

</div>

<p>答对：<span id="correct">0</span>

&nbsp; 已答：<span id="answered">0</span></p>

<p>正确率：<span id="accuracy">—</span></p>

<label>练习数量：</label>

<select id="total">

  <option value="10">10题</option>

  <option value="20" selected>20题</option>

  <option value="50">50题</option>

  <option value="100">100题</option>

</select>

<br>

<button class="start" id="start">开始练习</button>

<button class="other" id="pause" disabled>暂停</button>

<p>判断方法：各位数字之和是3的倍数，

原数就是3的倍数。</p>

<script>

const $ = id => document.getElementById(id);

let numbers = [];

let index = 0;

let correct = 0;

let answered = 0;

let active = false;

let paused = false;

let locked = false;

let timer = null;

let deadline = 0;

let remaining = 3;

function isMultipleOf3(n) {

  return n % 3 === 0;

}

function stopTimer() {

  clearInterval(timer);

  timer = null;

}

function updateStats() {

  $("correct").textContent = correct;

  $("answered").textContent = answered;

  $("accuracy").textContent = answered

    ? Math.round(correct / answered * 100) + "%"

    : "—";

}

function setButtons(enabled) {

  $("yes").disabled = !enabled;

  $("no").disabled = !enabled;

}

function showCard() {

  locked = false;

  setButtons(true);

  remaining = 3;

  deadline = Date.now() + 3000;

  $("number").textContent = numbers[index];

  $("progress").textContent =

    `第 ${index + 1} / ${numbers.length} 题`;

  $("timer").textContent = "3.0 秒";

  $("feedback").textContent = "请快速判断！";

  $("feedback").style.color = "#14213d";

  stopTimer();

  timer = setInterval(() => {

    if (!active || paused) return;

    remaining = Math.max(

      0, (deadline - Date.now()) / 1000

    );

    $("timer").textContent =

      remaining.toFixed(1) + " 秒";

    if (remaining <= 0) {

      stopTimer();

      nextCard();

    }

  }, 50);

}

function answer(value) {

  if (!active || paused || locked) return;

  locked = true;

  setButtons(false);

  answered++;

  if (value === isMultipleOf3(numbers[index])) {

    correct++;

    $("feedback").textContent = "✓ 正确！";

    $("feedback").style.color = "#219653";

  } else {

    $("feedback").textContent = "✗ 不正确，继续加油！";

    $("feedback").style.color = "#e74c3c";

  }

  updateStats();

}

function nextCard() {

  if (!active) return;

  index++;

  if (index >= numbers.length) {

    finish();

  } else {

    showCard();

  }

}

function finish() {

  active = false;

  paused = false;

  stopTimer();

  setButtons(false);

  $("number").textContent = "完成！";

  $("progress").textContent = "练习结束";

  $("timer").textContent = "—";

  $("feedback").textContent =

    `答对 ${correct}/${answered}，正确率 ` +

    `${answered ? Math.round(correct / answered * 100) : 0}%`;

  $("start").textContent = "再练一次";

  $("pause").disabled = true;

}

function startGame() {

  stopTimer();

  numbers = Array.from(

    { length: 900 }, (_, i) => i + 100

  );

  for (let i = numbers.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [numbers[i], numbers[j]] = [numbers[j], numbers[i]];

  }

  numbers = numbers.slice(0, Number($("total").value));

  index = 0;

  correct = 0;

  answered = 0;

  active = true;

  paused = false;

  updateStats();

  $("start").textContent = "重新开始";

  $("pause").textContent = "暂停";

  $("pause").disabled = false;

  showCard();

}

$("yes").addEventListener("click", () => answer(true));

$("no").addEventListener("click", () => answer(false));

$("start").addEventListener("click", startGame);

$("pause").addEventListener("click", () => {

  if (!active) return;

  paused = !paused;

  if (paused) {

    remaining = Math.max(

      0, (deadline - Date.now()) / 1000

    );

    stopTimer();

    $("pause").textContent = "继续";

    $("feedback").textContent = "已暂停";

    setButtons(false);

  } else {

    deadline = Date.now() + remaining * 1000;

    $("pause").textContent = "暂停";

    setButtons(!locked);

    timer = setInterval(() => {

      if (!active || paused) return;

      remaining = Math.max(

        0, (deadline - Date.now()) / 1000

      );

      $("timer").textContent =

        remaining.toFixed(1) + " 秒";

      if (remaining <= 0) {

        stopTimer();

        nextCard();

      }

    }, 50);

  }

});

</script>

</body>

</html>
